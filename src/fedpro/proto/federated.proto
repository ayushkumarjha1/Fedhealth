syntax = "proto3";

package federated;

service FederatedLearning {
    // Client requests the global model from the server
    rpc GetGlobalModel(ModelRequest) returns (ModelResponse) {}
    
    // Client sends the trained local model back to the server
    rpc SendLocalModel(LocalModelUpdate) returns (UpdateResponse) {}
}

message ModelRequest {
    string client_id = 1;
}

message ModelResponse {
    int32 round = 1;
    // We send weights as bytes to easily serialize PyTorch state_dict
    bytes weights = 2; 
    string status = 3;
}

message LocalModelUpdate {
    string client_id = 1;
    int32 round = 2;
    int32 num_samples = 3;
    bytes weights = 4;
    float loss = 5;
}

message UpdateResponse {
    string status = 1;
}
